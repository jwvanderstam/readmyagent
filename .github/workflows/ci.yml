name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          test -z "$(git status --porcelain drizzle)" || { echo "Schema changed without a committed migration. Run pnpm db:generate."; git status --porcelain drizzle; exit 1; }
      - run: pnpm audit --prod
      - run: pnpm build
